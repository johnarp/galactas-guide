<body>

        <a href="../index.html" class="site-title">Galacta's Guide</a>
        <nav>
            <ul class="nav-main">
                <li><a href="../index.html">Home</a></li>
                <li><a href="tracker.html">Tracker</a></li>
                <li><a href="creator.html">Creator</a></li>
            </ul>
            <ul class="nav-utils">
                <li><button class="nav-hamburger" aria-label="Open menu" aria-expanded="false">☰</button></li>
                <li><a href="settings.html" class="nav-icon-btn" title="Settings" aria-label="Settings"><svg

                <li><a href="profile.html" class="nav-icon-btn active" title="Profile" aria-label="Profile"><svg

                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">

                        </svg></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="profile-header-new">
            <div class="profile-nameplate" id="current-nameplate"
                style="background-image: url('../assets/heroes/adam-warlock/nameplate.png');"></div>
            <div class="profile-identity">
                <h1 id="profile-display-name">Player</h1>
                <div class="profile-badges">
                    <span id="account-level" title="Click for details">LVL 0</span>
                    <button id="open-customize-btn" class="edit-btn" title="Customize Profile">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="profile-body">
            <div class="profile-left-col">
                <!-- Rank breakdown -->
                <div class="breakdown-card">
                    <h2>Proficiency Breakdown</h2>
                    <p id="breakdown-avg" class="breakdown-avg"></p>
                    <div id="rank-breakdown"></div>
                </div>

                <!-- Creator count -->
                <div class="concepts-card">
                    <h2>Creator</h2>
                    <span id="concepts-number" class="concepts-number">0</span>
                    <span class="concepts-label">Concepts Created</span>
                </div>
            </div>

            <img id="profile-display-hero" src="../assets/heroes/adam-warlock/adam-warlock.png" alt="Featured Hero">
        </div>
    </main>

    <!-- Reusable Modal Container -->
    <div id="level-modal" class="profile-modal-overlay hidden">
        <div class="profile-modal-content">
            <span class="profile-modal-close" id="close-level-modal">&times;</span>
            <h3>Account Level</h3>
            <p>Your Account Level is calculated by adding together the individual levels of every hero you are currently
                tracking.</p>
        </div>
    </div>

    <!-- Customization Modal -->
    <div id="customize-modal" class="modal hidden">
        <div class="modal-content customize-modal-content">
            <span class="modal-close" id="close-customize-modal">&times;</span>
            <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--primary-dim); padding-bottom: 0.5rem;">
                Customize Profile</h3>

            <!-- Name Edit -->
            <div class="customize-section">
                <label>Player Name</label>
                <input type="text" id="modal-name-input" placeholder="Enter your name..." autocomplete="off">
            </div>

            <!-- Nameplate Selection -->
            <div class="customize-section">
                <label>Nameplate</label>
                <div class="hero-icon-grid" id="nameplate-grid"></div>
            </div>

            <!-- Display Hero Selection -->
            <div class="customize-section">
                <label>Featured Hero</label>
                <div class="hero-icon-grid" id="display-hero-grid"></div>

                <!-- Prestige/Base Selector (Hidden until a hero is clicked) -->
                <div id="style-selector-container" class="hidden">
                    <label style="margin-top: 1rem;">Select Style</label>
                    <div class="style-options">
                        <div class="style-card" id="style-base" data-style="image">
                            <img src="" alt="Base">
                            <span>Base</span>
                        </div>
                        <div class="style-card" id="style-prestige" data-style="prestige">
                            <img src="" alt="Prestige">
                            <span>Prestige</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/profile.js"></script>
    <script>!function () { var b = document.querySelector('.nav-hamburger'); if (!b) return; var h = document.querySelector('header'); b.addEventListener('click', function () { var o = h.classList.toggle('nav-open'); b.setAttribute('aria-expanded', String(o)); }); document.addEventListener('click', function (e) { if (!h.contains(e.target) && h.classList.contains('nav-open')) { h.classList.remove('nav-open'); b.setAttribute('aria-expanded', 'false'); } }); }();</script>
</body>

</html>
