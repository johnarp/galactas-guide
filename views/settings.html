    <main>
        <h1>Settings</h1>

        <!-- Appearance -->
        <section class="settings-section">
            <h2>Appearance</h2>

            <div class="setting-group">
                <span class="setting-label">View Mode</span>
                <div class="setting-options">
                    <button class="option-btn" data-setting="viewMode" data-value="card">Card</button>
                    <button class="option-btn" data-setting="viewMode" data-value="icon">Icon</button>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">Theme</span>
                <div class="setting-options">
                    <button class="option-btn" data-setting="theme" data-value="galacta">Galacta</button>
                    <button class="option-btn" data-setting="theme" data-value="rivals">Rivals</button>
                    <button class="option-btn" data-setting="theme" data-value="symbiote">Symbiote</button>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">Card Background</span>
                <div class="setting-options">
                    <button class="option-btn" data-setting="cardBgMode" data-value="hero">Hero</button>
                    <button class="option-btn" data-setting="cardBgMode" data-value="proficiency">Proficiency</button>
                    <button class="option-btn" data-setting="cardBgMode" data-value="role">Role</button>
                    <button class="option-btn" data-setting="cardBgMode" data-value="rarity">Rarity</button>
                    <button class="option-btn" data-setting="cardBgMode" data-value="difficulty">Difficulty</button>
                    <button class="option-btn" data-setting="cardBgMode" data-value="season">Season</button>
                    <button class="option-btn" data-setting="cardBgMode" data-value="none">None</button>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">Show Name</span>
                <div class="setting-options">
                    <button class="option-btn" data-setting="showName" data-value="on">On</button>
                    <button class="option-btn" data-setting="showName" data-value="off">Off</button>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">Show Proficiency</span>
                <div class="setting-options">
                    <button class="option-btn" data-setting="showProficiency" data-value="on">On</button>
                    <button class="option-btn" data-setting="showProficiency" data-value="off">Off</button>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">Show Hover Image</span>
                <div class="setting-options">
                    <button class="option-btn" data-setting="showHoverImage" data-value="on">On</button>
                    <button class="option-btn" data-setting="showHoverImage" data-value="off">Off</button>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">Show Costumes</span>
                <div class="setting-options">
                    <button class="option-btn" data-setting="showCostumes" data-value="on">On</button>
                    <button class="option-btn" data-setting="showCostumes" data-value="off">Off</button>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">Show Role Icon</span>
                <div class="setting-options">
                    <button class="option-btn" data-setting="showRoleIcons" data-value="on">On</button>
                    <button class="option-btn" data-setting="showRoleIcons" data-value="off">Off</button>
                </div>
            </div>

        </section>

        <!-- Info -->
        <section class="settings-section">
            <h2>Info</h2>
            <div class="settings-actions">
                <button id="costume-catalog-btn" class="btn btn-ghost">Supported Costumes</button>
                <button onclick="window.open('https://github.com/johnarp/galactas-guide', '_blank')"  class="btn btn-ghost">Source Code</button>
                <button onclick="window.open('https://github.com/johnarp/galactas-guide/issues', '_blank')" class="btn btn-ghost">Report Issue</button>
            </div>
        </section>

        <!-- Data -->
        <section class="settings-section">
            <h2>Data</h2>
            <p style="opacity:0.6;font-size:0.9rem;margin:0 0 1rem">
                All progress is stored locally in your browser. Export a backup before clearing.
            </p>
            <div class="settings-actions">
                <button id="export-btn" class="btn btn-primary">Export Backup</button>
                <label class="btn btn-ghost" style="cursor:pointer">
                    Import Backup
                    <input id="import-file" type="file" accept=".json" hidden>
                </label>
                <button id="clear-btn" class="btn btn-danger">Clear All Data</button>
            </div>
            <div id="notice" class="notice hidden"></div>
        </section>
    </main>

    <div id="costume-catalog-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="catalog-title"
        tabindex="-1">
        <div class="modal-content" style="max-width:36rem">
            <button id="costume-catalog-close" class="modal-close" aria-label="Close">✕</button>
            <h2 id="catalog-title" style="margin-bottom:0.25rem;padding-right:2rem">Supported Costumes</h2>
            <p id="catalog-subtitle" style="opacity:0.4;font-size:0.8rem;margin:0 0 1.25rem"></p>
            <div id="costume-catalog-list" class="costume-catalog"></div>
        </div>
    </div>

    <script type="module" src="../scripts/settings.js"></script>
    <script>!function () { var b = document.querySelector('.nav-hamburger'); if (!b) return; var h = document.querySelector('header'); b.addEventListener('click', function () { var o = h.classList.toggle('nav-open'); b.setAttribute('aria-expanded', String(o)); }); document.addEventListener('click', function (e) { if (!h.contains(e.target) && h.classList.contains('nav-open')) { h.classList.remove('nav-open'); b.setAttribute('aria-expanded', 'false'); } }); }();</script>

</html>
