<head>
    <meta charset="UTF-8">

    <meta name="viewport"               content="width=device-width, initial-scale=1.0">
    <meta name="theme-color"            content="#a612ea">
    <meta name="description"            content="A Marvel Rivals proficiency tracker and hero creator.">

    <meta property="og:title"           content="Tracker | Galacta's Guide">
    <meta property="og:site_name"       content="Galacta's Guide">
    <meta property="og:description"     content="A Marvel Rivals proficiency tracker and hero creator.">
    <meta property="og:image"           content="https://johnarp.github.io/galactas-guide/assets/github/social_preview.png">
    <meta property="og:image:alt"       content="A Marvel Rivals proficiency tracker and hero creator.">

    <meta name="twitter:title"          content="Tracker | Galacta's Guide">
    <meta name="twitter:description"    content="A Marvel Rivals proficiency tracker and hero creator.">
    <meta name="twitter:image"          content="https://johnarp.github.io/galactas-guide/assets/github/social_preview.png">
    <title>Tracker | Galacta's Guide</title>
    <link rel="stylesheet" href="../app/styles.css">
    <link rel="icon" href="../assets/github/icon.png" type="image/png">
    <script>try{var _s=JSON.parse(localStorage.getItem('gg'));if(_s?.settings?.theme)document.documentElement.dataset.theme=_s.settings.theme;}catch(e){}</script>
</head>
<body>
    <header>
        <a href="../index.html" class="site-title">Galacta's Guide</a>
        <nav>
            <ul class="nav-main">
                <li><a href="../index.html">Home</a></li>
                <li><a href="tracker.html" class="active">Tracker</a></li>
                <li><a href="creator.html">Creator</a></li>
            </ul>
            <ul class="nav-utils">
                <li><a href="settings.html" class="nav-icon-btn" title="Settings" aria-label="Settings"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a></li>
                <li><a href="profile.html" class="nav-icon-btn" title="Profile" aria-label="Profile"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="tracker-controls">
            <div class="filters-row">
                <div id="role-filters"></div>
                <button id="filter-favorites" class="filter-btn" title="Favourites only">★</button>
                <button id="filter-custom"    class="filter-btn" title="Custom heroes only">🧪</button>
            </div>
            <div class="controls-right">
                <input type="search" id="hero-search" class="hero-search"
                       placeholder="Search…" aria-label="Search heroes" autocomplete="off">
                <select id="sort-select" class="sort-select" aria-label="Sort heroes">
                    <option value="name-asc">Name A–Z</option>
                    <option value="name-desc">Name Z–A</option>
                    <option value="rank-desc">Rank High → Low</option>
                    <option value="rank-asc">Rank Low → High</option>
                    <option value="levelup-asc">Level Up — Closest</option>
                    <option value="levelup-desc">Level Up — Farthest</option>
                    <option value="rel-asc">Season Old → New</option>
                    <option value="rel-desc">Season New → Old</option>
                </select>
            </div>
        </div>
        <div id="hero-grid"></div>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-hero-name" tabindex="-1">
        <div class="modal-content">
            <button id="modal-close" class="modal-close" aria-label="Close">✕</button>
            <div class="modal-hero-header">
                <img id="modal-hero-art" src="" alt="" class="modal-hero-art">
                <h2 id="modal-hero-name"></h2>
            </div>
            <div id="rank-grid" class="rank-grid"></div>
            <div id="level-section" class="level-section hidden">
                <label class="field-label">
                    Level (<span id="level-range"></span>)
                    <input id="level-input" type="number" class="number-input" min="1" max="50">
                </label>
                <div id="points-section" class="hidden">
                    <label class="field-label">
                        Points — optional (max <span id="points-max"></span>)
                        <input id="points-input" type="number" class="number-input" min="0">
                    </label>
                </div>
            </div>
            <div class="modal-actions">
                <button id="modal-clear" class="btn btn-ghost">Clear</button>
                <button id="modal-save"  class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/tracker.js"></script>
</body>
</html>
