    <title>Creator | Galacta's Guide</title>
    <link rel="stylesheet" href="../app/styles.css">
    <link rel="icon" href="../assets/github/icon.png" type="image/png">

</head>

<body>

        <a href="../index.html" class="site-title">Galacta's Guide</a>
        <nav>
            <ul class="nav-main">
                <li><a href="../index.html">Home</a></li>
                <li><a href="tracker.html">Tracker</a></li>
                <li><a href="creator.html" class="active">Creator</a></li>
            </ul>
            <ul class="nav-utils">
                <li><button class="nav-hamburger" aria-label="Open menu" aria-expanded="false">☰</button></li>
                <li>
                    <a href="settings.html" class="nav-icon-btn" title="Settings" aria-label="Settings">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                        </svg>
                    </a>
                </li>
                <li>
                    <a href="profile.html" class="nav-icon-btn" title="Profile" aria-label="Profile">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Controls — reuses tracker CSS classes -->
        <div class="tracker-controls">
            <div class="filters-row">
                <div id="creator-role-filters"></div>
            </div>
            <div class="controls-right">
                <input type="search" id="creator-search" class="hero-search" placeholder="Search…"
                    aria-label="Search concepts" autocomplete="off">
                <select id="creator-size-select" class="sort-select" aria-label="Card size">
                    <option value="sm">Small</option>
                    <option value="md">Medium</option>
                    <option value="lg">Large</option>
                </select>
                <select id="creator-sort-select" class="sort-select" aria-label="Sort concepts">
                    <option value="name-asc">Name A–Z</option>
                    <option value="name-desc">Name Z–A</option>
                    <option value="season-asc">Season Old → New</option>
                    <option value="season-desc">Season New → Old</option>
                </select>
            </div>
        </div>

        <div id="creator-grid"></div>
    </main>

    <!-- ── Edit modal ──────────────────────────────────────────────────────── -->
    <div id="creator-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="creator-modal-title"
        tabindex="-1">
        <div class="modal-content creator-modal">
            <button id="creator-modal-close" class="modal-close" aria-label="Close">✕</button>
            <h2 id="creator-modal-title" style="margin-bottom:1.5rem;padding-right:2rem">New Hero</h2>

            <div class="creator-form-grid">

                <!-- Name -->
                <div class="full-width">
                    <label class="field-label">Name
                        <input id="creator-name" type="text" class="text-input" placeholder="Hero Name" maxlength="48">
                    </label>
                </div>

                <!-- Color -->
                <div>
                    <label class="field-label">Background Color</label>
                    <div class="color-input-row">
                        <input id="creator-color" type="color" value="#a612ea">
                        <span id="creator-color-display" class="color-hex-display">#A612EA</span>
                    </div>
                </div>

                <!-- Season and Difficulty -->
                <div>
                    <label class="field-label">Season — optional
                        <input id="creator-season" type="number" class="text-input" placeholder="e.g. 3" min="0"
                            style="margin-top:0.4rem">
                    </label>
                    <label class="field-label">Difficulty— optional
                        <select id="creator-difficulty" class="text-input" style="margin-top:0.4rem; text-transform: none;">
                            <option value="">Select Difficulty</option>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </label>
                </div>

                <!-- Roles -->
                <div class="full-width">
                    <label class="field-label">Role(s)</label>
                    <div id="modal-role-pickers" class="role-checkboxes"></div>
                </div>

                <!-- Image picker -->
                <div class="full-width">
                    <label class="field-label">Appearance</label>
                    <div id="image-picker" class="image-picker"></div>
                    <div style="margin-top:0.5rem">
                        <button type="button" id="image-link-btn" class="btn btn-ghost"
                            style="font-size:0.78rem;padding:0.35rem 0.85rem">🔗 Link Images</button>
                    </div>
                </div>

                <!-- Abilities -->
                <div class="full-width">
                    <label class="field-label">Abilities</label>
                    <div id="abilities-list" class="abilities-editor"></div>
                    <div style="margin-top:0.5rem">
                        <button type="button" id="ability-add-btn" class="btn btn-ghost"
                            style="font-size:0.78rem;padding:0.35rem 0.85rem">+ Add Ability</button>
                    </div>
                </div>

                <!-- Show in Tracker -->
                <div class="full-width">
                    <div class="tracker-toggle-row">
                        <span class="tracker-toggle-label">Show in Tracker</span>
                        <label class="toggle-switch">
                            <input id="tracker-toggle" type="checkbox">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>

            </div>

            <div class="modal-actions" style="margin-top:1.5rem">
                <button id="creator-modal-cancel" class="btn btn-ghost">Cancel</button>
                <button id="creator-modal-save" class="btn btn-primary">Save Hero</button>
            </div>
        </div>
    </div>

    <!-- ── View modal ──────────────────────────────────────────────────────── -->
    <div id="creator-view-modal" class="modal hidden" role="dialog" aria-modal="true"
        aria-labelledby="creator-view-name" tabindex="-1">
        <div class="modal-content creator-view-modal-content">
            <button id="creator-view-close" class="modal-close" style="z-index:10" aria-label="Close">✕</button>

            <!-- Colored banner with art -->
            <div id="creator-view-banner" class="creator-view-banner">
                <img id="creator-view-art" class="creator-view-art" src="" alt="">
                <div class="creator-view-overlay">
                    <div id="creator-view-name" class="creator-view-name"></div>
                    <div id="creator-view-roles" class="creator-view-roles"></div>
                </div>
            </div>

            <!-- Meta + abilities -->
            <div class="creator-view-body">
                <span id="creator-view-season" class="creator-view-season hidden"></span>
                <span id="creator-view-difficulty" class="creator-view-season hidden"></span>

                <div id="creator-view-abilities" class="creator-view-abilities-section hidden">
                    <p class="creator-view-section-title">Abilities</p>
                    <table class="view-abilities-table">
                        <thead>
                            <tr>
                                <th>Key</th>
                                <th>Name</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody id="creator-view-abilities-list"></tbody>
                    </table>
                </div>

                <p id="creator-view-abilities-empty" class="hidden"
                    style="opacity:0.4;font-size:0.82rem;margin:0.5rem 0 0">No abilities defined.</p>
            </div>

            <div class="modal-actions" style="margin-top:1.25rem">
                <button id="creator-view-edit" class="btn btn-primary">Edit Hero</button>
            </div>
        </div>
    </div>

    <!-- ── Image link modal ────────────────────────────────────────────────── -->
    <div id="image-link-modal" class="modal hidden" role="dialog" aria-modal="true" tabindex="-1">
        <div class="modal-content" style="max-width:30rem">
            <button id="image-link-close" class="modal-close" aria-label="Close">✕</button>
            <h2 style="margin-bottom:0.4rem;padding-right:2rem">Link Images</h2>
            <p style="opacity:0.45;font-size:0.78rem;margin:0 0 1.25rem">Paste direct image URLs. Leave blank to use the
                placeholder selection. Works with Imgur, Discord CDN, GitHub uploads, etc.</p>

            <div style="display:flex;flex-direction:column;gap:0.75rem">
                <label class="field-label">Card Image
                    <input id="link-image" type="url" class="text-input" placeholder="https://..."
                        style="margin-top:0.4rem;text-transform:none">
                </label>
                <label class="field-label">Hover Image
                    <input id="link-prestige" type="url" class="text-input" placeholder="https://..."
                        style="margin-top:0.4rem;text-transform:none">
                </label>
                <label class="field-label">Icon
                    <input id="link-icon" type="url" class="text-input" placeholder="https://..."
                        style="margin-top:0.4rem;text-transform:none">
                </label>
                <label class="field-label">Lord Icon
                    <input id="link-icon-lord" type="url" class="text-input" placeholder="https://..."
                        style="margin-top:0.4rem;text-transform:none">
                </label>
                <label class="field-label">Champion Icon
                    <input id="link-icon-champion" type="url" class="text-input" placeholder="https://..."
                        style="margin-top:0.4rem;text-transform:none">
                </label>
            </div>

            <div class="modal-actions" style="margin-top:1.25rem">
                <button id="image-link-clear" class="btn btn-ghost">Clear All</button>
                <button id="image-link-done" class="btn btn-primary">Done</button>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/creator.js"></script>
    <script>!function () { var b = document.querySelector('.nav-hamburger'); if (!b) return; var h = document.querySelector('header'); b.addEventListener('click', function () { var o = h.classList.toggle('nav-open'); b.setAttribute('aria-expanded', String(o)); }); document.addEventListener('click', function (e) { if (!h.contains(e.target) && h.classList.contains('nav-open')) { h.classList.remove('nav-open'); b.setAttribute('aria-expanded', 'false'); } }); }();</script>
</body>

</html>
